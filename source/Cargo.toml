[package]
name = "scrollpilot"
version = "0.6.10"
edition = "2021"
description = "Smooth, tunable mouse wheel scrolling for Windows."
license = "MIT"
repository = "https://github.com/Frozt-src/ScrollMage"
readme = "README.md"
publish = false

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Accessibility", "Win32_UI_Controls", "Win32_UI_Shell", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_Graphics_GdiPlus", "Win32_System_LibraryLoader", "Win32_System_Com", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_Security", "Win32_System_Registry", "Win32_Storage_FileSystem", "Win32_UI_HiDpi"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

